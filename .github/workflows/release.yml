name: Release

# Builds a macOS .dmg and publishes it to GitHub Releases whenever a version
# tag is pushed — the whole point being that nobody has to build locally.
#
#   git tag v0.2.0
#   git push origin v0.2.0
#
# The team then grabs the .dmg from the repo's Releases page. See the
# README's "For your team" section for the one-time Gatekeeper step
# unsigned apps need on first launch.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Build native audio-capture helper (universal arm64 + x86_64)
        run: npm run build:audiotap

      - name: Build and publish the .dmg
        run: npm run package:mac -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
