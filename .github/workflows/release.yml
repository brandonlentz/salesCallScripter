name: Release

# Builds a macOS .dmg and publishes it to GitHub Releases whenever a version
# tag is pushed — the whole point being that nobody has to build locally.
#
#   git tag v0.2.0
#   git push origin v0.2.0
#
# The team then grabs the .dmg from the repo's Releases page. See the
# README's "For your team" section for the one-time Gatekeeper step
# unsigned apps need on first launch.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    # macos-14's default Xcode (15.4) only ships the macOS 14.5 SDK, which
    # can't satisfy native/audiotap/build.sh's `-target ...-macos15.0` (the
    # Core Audio process-tap APIs require the macOS 15 SDK) — swiftc fails
    # fast with an unsupported-deployment-target error. macos-15's default
    # Xcode (16.4) ships the macOS 15.5 SDK, which covers it, and this
    # project already requires macOS 15+ to run anyway.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Build native audio-capture helper (universal arm64 + x86_64)
        run: npm run build:audiotap

      - name: Build the .dmg
        # --publish never is required, not just "omit --publish": electron-
        # builder defaults to publishing on its own (policy 'onTagOrDraft')
        # whenever a `publish` config exists in package.json AND it detects
        # a CI environment (GitHub Actions always sets one) — regardless of
        # whether --publish was passed. electron-builder's own GitHub
        # publish step uploads the .dmg/.blockmap/latest-mac.yml as
        # separate parallel tasks, each independently doing a
        # find-or-create-release-for-this-tag check; those checks raced
        # against each other on v0.1.0, v0.1.2, and v0.1.3 (all three
        # created two release objects for the same tag at the identical
        # timestamp, each holding a different subset of the assets),
        # leaving GitHub's tag→release routing pointed at whichever one
        # didn't get the real installer. Building locally into dist/ here
        # (explicitly not publishing) and publishing everything in one
        # atomic step below (which creates at most one release) removes
        # the race entirely.
        run: npm run package:mac -- --publish never

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
