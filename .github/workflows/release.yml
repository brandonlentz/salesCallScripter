name: Release

# Builds a macOS .dmg and publishes it to GitHub Releases whenever a version
# tag is pushed — the whole point being that nobody has to build locally.
#
#   git tag v0.2.0
#   git push origin v0.2.0
#
# The team then grabs the .dmg from the repo's Releases page. See the
# README's "For your team" section for the one-time Gatekeeper step
# unsigned apps need on first launch.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    # macos-14's default Xcode (15.4) only ships the macOS 14.5 SDK, which
    # can't satisfy native/audiotap/build.sh's `-target ...-macos15.0` (the
    # Core Audio process-tap APIs require the macOS 15 SDK) — swiftc fails
    # fast with an unsupported-deployment-target error. macos-15's default
    # Xcode (16.4) ships the macOS 15.5 SDK, which covers it, and this
    # project already requires macOS 15+ to run anyway.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # Signs the app with a real Apple Developer ID instead of shipping
      # unsigned — unsigned apps can't get a stable, persistent TCC
      # identity, which is what caused teammates to see repeated/duplicate
      # microphone permission prompts. No-ops entirely (steps below just
      # skip signing/notarizing, exactly like before) until the three repo
      # secrets below are added — see the README's code-signing section for
      # how to generate them. Keychain is temporary and runner-local; it
      # never touches anyone's real keychain.
      - name: Import Developer ID certificate
        if: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          echo -n "$MAC_CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MAC_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          EXISTING_KEYCHAINS=$(security list-keychains -d user | sed 's/[" ]//g')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          # Exported so native/audiotap/build.sh (next step) can sign the
          # helper binary with it directly — electron-builder's own signing
          # pass (in "Build the .dmg") auto-discovers the same identity
          # from this keychain on its own, no further passing needed there.
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build native audio-capture helper (universal arm64 + x86_64)
        run: npm run build:audiotap

      # notarytool (what electron-builder's notarization step shells out to)
      # takes the App Store Connect API key as a file path, not raw
      # content — this writes the secret's content to one before the build.
      - name: Write App Store Connect API key
        if: ${{ secrets.APPLE_API_KEY != '' }}
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          KEY_PATH="$RUNNER_TEMP/apple-api-key.p8"
          echo "$APPLE_API_KEY_CONTENT" > "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build the .dmg
        # --publish never is required, not just "omit --publish": electron-
        # builder defaults to publishing on its own (policy 'onTagOrDraft')
        # whenever a `publish` config exists in package.json AND it detects
        # a CI environment (GitHub Actions always sets one) — regardless of
        # whether --publish was passed. electron-builder's own GitHub
        # publish step uploads the .dmg/.blockmap/latest-mac.yml as
        # separate parallel tasks, each independently doing a
        # find-or-create-release-for-this-tag check; those checks raced
        # against each other on v0.1.0, v0.1.2, and v0.1.3 (all three
        # created two release objects for the same tag at the identical
        # timestamp, each holding a different subset of the assets),
        # leaving GitHub's tag→release routing pointed at whichever one
        # didn't get the real installer. Building locally into dist/ here
        # (explicitly not publishing) and publishing everything in one
        # atomic step below (which creates at most one release) removes
        # the race entirely.
        # APPLE_API_KEY is set via $GITHUB_ENV by the step above (only when
        # that secret exists); APPLE_API_KEY_ID/APPLE_API_ISSUER are plain
        # strings, passed straight from secrets. electron-builder's
        # notarization auto-detects from these three env vars — see
        # node_modules/app-builder-lib/out/mac/MacTargetHelper.js. When none
        # of the three signing/notarization secrets are set, every step
        # above becomes a no-op and this produces the same unsigned build
        # as before.
        run: npm run package:mac -- --publish never
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
